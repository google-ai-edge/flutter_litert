name: Cache Gradle's downloads and resolve them from Google's copy of Maven Central
description: >-
  The Android jobs shared one Gradle cache entry, which build-android-agp9,
  the fastest, saved first with only what its AGP 9.2.1 plugin build needs,
  and which no job could update after, so every other job downloaded 186 to
  315 files, 366 to 804 MB, again on every run. With about 40 Android jobs
  in an hour, Maven Central answered "too many requests" and the plugin
  portal failed, and Gradle gave up after 3 tries within a few seconds
  (2026-11-27). The dependencies are now cached for each app the jobs
  build, Gradle gets them from Google's copy of Maven Central and retries a
  failed download for about 4 minutes, and the Gradle distributions, NDK and
  CMake the builds use are downloaded with retries before Gradle needs them.
inputs:
  downloads:
    description: >-
      The cache entry the job uses, named for what it builds: example for
      example/android, play-services-test-host for
      example/play_services_test_host/android, agp9 for the plugin with
      AGP 9. Jobs that build the same app need the same dependencies.
    required: true
  save:
    description: >-
      'true' in the one job of flutter-ci.yml that saves the entry: the job
      whose builds need every dependency the entry's other jobs need. It
      saves only on a push to main; every other run only restores.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # Only what Gradle downloaded and its records of where it came from.
    # Never the build outputs, transforms or build cache, so a cached build
    # cannot hide a real break. The key changes with every Gradle file and
    # with flutter-ci.yml, which pins the Flutter version and the AGP 9 job's
    # versions. A run whose key is new starts from the entry's latest version
    # and downloads only what changed. On a miss Gradle downloads everything,
    # as it did before. Only a push to main saves, in the job that passes
    # save; pull requests, manual runs, other branches and the other jobs only
    # restore, so they cannot change what main restores, and the three
    # entries, about 2.5 GB, stay within the repository's 10 GB of cache next
    # to the Flutter SDKs.
    - if: inputs.save != 'true' || github.event_name != 'push' || github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.gradle/caches/modules-2/files-2.1
          ~/.gradle/caches/modules-2/metadata-*
        key: gradle-downloads-${{ runner.os }}.${{ inputs.downloads }}.${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '.github/workflows/flutter-ci.yml') }}
        restore-keys: gradle-downloads-${{ runner.os }}.${{ inputs.downloads }}.
    # Saved at the end of the job if it passed and its key was not restored.
    - if: inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.gradle/caches/modules-2/files-2.1
          ~/.gradle/caches/modules-2/metadata-*
        key: gradle-downloads-${{ runner.os }}.${{ inputs.downloads }}.${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '.github/workflows/flutter-ci.yml') }}
        restore-keys: gradle-downloads-${{ runner.os }}.${{ inputs.downloads }}.
    # Wherever a build names Maven Central, for plugins, settings, projects or
    # build scripts, Google's copy takes its place, as in google/flutter-mediapipe,
    # where Maven Central failed whole jobs on 8 of 50 runners and the copy
    # answered on all 50 (2026-11-19). The copy gets a release about a day
    # after Maven Central. Plugins come from Google's Maven, the copy and then
    # the portal, which serves kotlin-dsl and sends what the copy has not got
    # yet on to Maven Central.
    - name: Resolve Gradle downloads from Google's copy of Maven Central
      shell: bash
      run: |
        mkdir -p ~/.gradle/init.d
        cat > ~/.gradle/init.d/plugin-repositories.init.gradle.kts <<'SCRIPT'
        fun RepositoryHandler.useCopy() {
            withType<MavenArtifactRepository>().whenObjectAdded {
                if (url.toString() == "https://repo.maven.apache.org/maven2/") {
                    url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
                }
            }
        }
        beforeSettings {
            buildscript.repositories.useCopy()
            dependencyResolutionManagement.repositories.useCopy()
            pluginManagement.repositories {
                useCopy()
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        allprojects {
            buildscript.repositories.useCopy()
            repositories.useCopy()
        }
        SCRIPT
    # Gradle tries a download that failed on the network or with a 5xx, 408 or
    # 429 3 times within a few seconds, and then gives up on that repository
    # for the rest of the build. These make it 10 times, from 0.5 s apart, about
    # 4 minutes in all. Gradle reads org.gradle.internal.repository.max.tentatives;
    # the max.retries this action set before is read by nothing, so the build
    # that failed on kotlin-dsl had 3 tries, not 10. They apply to every Gradle
    # build on the runner, Flutter's own included build too. A "not found"
    # (404) is never tried again; the Android builds handle that with
    # scripts/gradle_not_found.sh.
    - name: Retry Gradle downloads longer
      shell: bash
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties <<'PROPS'
        systemProp.org.gradle.internal.http.connectionTimeout=120000
        systemProp.org.gradle.internal.http.socketTimeout=120000
        systemProp.org.gradle.internal.repository.max.tentatives=10
        systemProp.org.gradle.internal.repository.initial.backoff=500
        PROPS
    # Flutter's gradlew downloads the Gradle distribution once, with no retry;
    # a 504 from github.com failed a run that way (2026-11-05). The script
    # puts the distribution where gradlew looks for it, with retries.
    - name: Download the Gradle distributions the examples use
      shell: bash
      run: >-
        scripts/gradle_distribution.sh
        example/android/gradle/wrapper/gradle-wrapper.properties
        example/play_services_test_host/android/gradle/wrapper/gradle-wrapper.properties
    # Each Android build's first Gradle run installs the NDK and CMake
    # through the Android Gradle plugin, which tries once; a download that
    # broke off failed the build ("Error reading Zip content",
    # "Archive is not a ZIP archive", 2026-11-03, 2026-11-12, 2026-11-13) and
    # the job built again. Installed here with the retries the emulator
    # packages get, the plugin finds them and downloads nothing. NDK
    # 28.2.13676358 is flutter.ndkVersion of Flutter 3.50.0 and what AGP 9.2.1
    # builds the plugin with; CMake 3.22.1 is the plugin's default CMake.
    - name: Install the NDK and CMake the Android builds use
      shell: bash
      run: bash scripts/android_sdk_packages.sh 'ndk;28.2.13676358' 'cmake;3.22.1'
