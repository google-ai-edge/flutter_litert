name: Retry runner failures

# Reruns the `build` workflow only when GitHub failed to provide or keep a machine
# for a job, the machine ran out of disk, a download from GitHub failed,
# Flutter's own Gradle build could not get the kotlin-dsl plugin from the plugin
# portal, or Maven Central turned a Gradle download away with 429, so real
# failures stay red. Stops after 3 attempts.
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  retry:
    if: >-
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun if a job lost its runner or a download failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id')
          for job in $jobs; do
            if gh api "repos/$GH_REPO/check-runs/$job/annotations" --jq '.[].message' \
              | grep -qE 'not acquired by Runner|lost communication with the server|No space left on device'; then
              echo "Job $job lost its runner, rerunning failed jobs."
              gh run rerun "$RUN_ID" --failed
              exit 0
            fi
            # The annotations do not name these failures, so they are found in the job's log.
            # kotlin-dsl is a plugin of Flutter's own Gradle build (flutter_tools), not of
            # this repository, and only the plugin portal serves it. It failed 43463814753,
            # and 45918888991 after Gradle's 10 tries (gradle-plugin-repositories).
            # Gradle does not try a 429 from Maven Central again; 3 of 40 Android jobs
            # failed that way within an hour on 2026-11-27.
            # Job logs hold color codes, and without --allow-escape-sequences the runner's
            # gh prints nothing for them ("the response contains terminal escape
            # sequences"), so no log was ever matched.
            if gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/$job/logs" 2> /dev/null \
              | grep -qE "Server returned HTTP response code: 5[0-9][0-9] for URL: https://github\.com/|flutter_litert: could not download|Plugin \[id: 'org\.gradle\.kotlin\.kotlin-dsl', version: '[0-9.]+'\] was not found|Received status code 429 from server: Too Many Requests"; then
              echo "Job $job failed a download, rerunning failed jobs."
              gh run rerun "$RUN_ID" --failed
              exit 0
            fi
          done
          echo "No runner or download failures found, nothing to rerun."
